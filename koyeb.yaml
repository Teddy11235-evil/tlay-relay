name: render-relay
services:
  - name: app
    type: web
    env:
      - name: PORT
        value: "8080"  # Changed from 8000 to 8080
    build:
      type: dockerfile
    ports:
      - port: 8080     # Changed from 8000 to 8080
        http_path: /health
        protocol: http
    regions:
      - fra
    scalings:
      - min: 1
        max: 1
