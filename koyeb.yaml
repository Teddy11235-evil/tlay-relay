name: render-relay
services:
  - name: app
    type: web
    env:
      - name: PORT
        value: "8000"
    build:
      type: dockerfile
    ports:
      - port: 8000
        http_path: /health  # Health check endpoint
        protocol: http
    regions:
      - fra
    scalings:
      - min: 1
        max: 1
    deployments:
      - name: always-free
        enable: true
        public: true
